name = "gtrz-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
APP_ENV = "staging"
CORS_ALLOWED_ORIGINS = "https://staging.gtrz.com.br,http://localhost:4321,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "gtrz-staging"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "gtrz-media-staging"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "gtrz_staging"
