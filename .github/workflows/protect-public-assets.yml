name: Protect public media interactions
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add public media protection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js = r'''(() => {
  const stopContextMenu = event => {
    event.preventDefault();
  };

  document.addEventListener('contextmenu', stopContextMenu, true);

  document.addEventListener('dragstart', event => {
    if (event.target?.closest?.('img, picture, svg, canvas, .svg-card')) {
      event.preventDefault();
    }
  }, true);

  document.addEventListener('keydown', event => {
    const saveShortcut = (event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === 's';
    if (saveShortcut) event.preventDefault();
  }, true);

  const lockMedia = root => {
    if (!root?.querySelectorAll) return;
    root.querySelectorAll('img').forEach(img => {
      img.draggable = false;
      img.setAttribute('draggable', 'false');
    });
  };

  lockMedia(document);
  new MutationObserver(records => {
    for (const record of records) {
      for (const node of record.addedNodes) {
        if (node.nodeType !== 1) continue;
        if (node.matches?.('img')) {
          node.draggable = false;
          node.setAttribute('draggable', 'false');
        }
        lockMedia(node);
      }
    }
  }).observe(document.documentElement, { childList:true, subtree:true });
})();
'''

          css = r'''img,
picture,
svg,
canvas,
.svg-card,
.artist-normalized,
.svg-fallback,
.dj-photo {
  -webkit-user-select: none;
  user-select: none;
  -webkit-user-drag: none;
  -webkit-touch-callout: none;
}
'''

          for base in [Path('.'), Path('public')]:
            assets = base / 'assets'
            assets.mkdir(parents=True, exist_ok=True)
            (assets / 'protect.js').write_text(js, encoding='utf-8')
            (assets / 'protect.css').write_text(css, encoding='utf-8')

            index = base / 'index.html'
            s = index.read_text(encoding='utf-8')
            if '/assets/protect.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="/assets/protect.css">\n</head>', 1)
            if '/assets/protect.js' not in s:
              s = s.replace('</body>', '<script src="/assets/protect.js" defer></script>\n</body>', 1)
            index.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/protect-public-assets.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Block easy saving of public media'
          git push
