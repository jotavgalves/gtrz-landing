name: Change DJ placeholder text
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace DJ placeholder text
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','public/index.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('FOTO DJ VOGN<br>EDITÁVEL PELO PAINEL','HOUVE UM ERRO<br>COM A SUA CONEXÃO')
              s=s.replace('FOTO DJ GLITZY<br>EDITÁVEL PELO PAINEL','HOUVE UM ERRO<br>COM A SUA CONEXÃO')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/change-dj-placeholder.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Change DJ image fallback message'
          git push
