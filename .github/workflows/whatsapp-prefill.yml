name: Add WhatsApp purchase messages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/whatsapp-prefill.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add dynamic WhatsApp messages
        shell: python
        run: |
          from pathlib import Path

          pt = "Olá! Quero comprar 1 ingresso para a La Rumba Jampa pelo WhatsApp, sem taxa. Vi no site que o {lot} lote está por R$ {price}. O evento é {date}, em {city}. Pode me enviar os dados para pagamento e confirmar minha compra?"
          es = "¡Hola! Quiero comprar 1 entrada para La Rumba Jampa por WhatsApp, sin tasa. Vi en el sitio que el lote {lot} está por R$ {price}. El evento es el {date}, en {city}. ¿Puedes enviarme los datos para el pago y confirmar mi compra?"

          for name in ['assets/site.js','public/assets/site.js']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              needle="wa:'https://wa.me/5581920013249',sympla:"
              repl=f"wa:'https://wa.me/5581920013249',waMessage:{{pt:{pt!r},es:{es!r}}},sympla:"
              if needle in s:
                  s=s.replace(needle,repl,1)
              marker="function applyDynamic(){"
              helpers="""function formatWaMessage(config,lot,price){const messages=config.waMessage||CONFIG.waMessage,template=messages?.[lang]||CONFIG.waMessage[lang];const vars={lot:ordinal(lot),price:String(price),date:config.eventDateLabel||CONFIG.eventDateLabel,city:config.city||CONFIG.city,venue:config.venue||CONFIG.venue};return String(template).replace(/\\{(lot|price|date|city|venue)\\}/g,(_,key)=>vars[key]??'')}\nfunction waUrl(raw,message){let base=String(raw||CONFIG.wa).trim();if(/^\\+?[\\d\\s().-]{8,}$/.test(base))base=`https://wa.me/${base.replace(/\\D/g,'')}`;try{const u=new URL(base);u.searchParams.set('text',message);return u.toString()}catch{const digits=base.replace(/\\D/g,'');return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`}}\n"""
              if 'function formatWaMessage(' not in s:
                  s=s.replace(marker,helpers+marker,1)
              old="const msg=lang==='es'?`Hola! Quiero comprar mi entrada del ${ordinal(lot)} lote de La Rumba Jampa por R$ ${price}.`:`Olá! Quero comprar meu ingresso do ${ordinal(lot)} lote da La Rumba Jampa por R$ ${price}.`;document.querySelectorAll('.js-wa').forEach(x=>x.href=wa+'?text='+encodeURIComponent(msg));"
              new="const msg=formatWaMessage(a,lot,price);document.querySelectorAll('.js-wa').forEach(x=>x.href=waUrl(wa,msg));"
              if old in s:
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')

          p=Path('src/functions-lib.js')
          s=p.read_text(encoding='utf-8')
          needle='"wa":"https://wa.me/5581920013249","sympla"'
          repl='"wa":"https://wa.me/5581920013249","waMessage":{"pt":'+__import__('json').dumps(pt,ensure_ascii=False)+',"es":'+__import__('json').dumps(es,ensure_ascii=False)+'},"sympla"'
          if needle in s:
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          for name in ['admin/index.html','public/admin/index.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              old='<div class="field"><label>WhatsApp</label><input id="wa"></div>'
              new='''<div class="field"><label>WhatsApp</label><input id="wa" placeholder="https://wa.me/5581..."><div class="help">Pode usar o link wa.me completo ou somente o número com DDI.</div></div>\n          <div class="field"><label>Mensagem automática WhatsApp · PT</label><textarea id="waMessagePt"></textarea><div class="help">Variáveis: {lot}, {price}, {date}, {city}, {venue}.</div></div>\n          <div class="field"><label>Mensagem automática WhatsApp · ES</label><textarea id="waMessageEs"></textarea><div class="help">Variáveis: {lot}, {price}, {date}, {city}, {venue}.</div></div>'''
              if old in s:
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')

          for name in ['admin/admin.js','public/admin/admin.js']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              needle=" for(const k of ['lot','price','date','eventDateLabel','eventTimeLabel','city','venue','wa','sympla','insta','email','address','mapLink','mapEmbedUrl','vognPhoto','glitzyPhoto','tickerSeconds'])if($(k))$(k).value=config[k]??'';"
              repl=needle+"\n waMessagePt.value=config.waMessage?.pt||'';waMessageEs.value=config.waMessage?.es||'';"
              if 'waMessagePt.value=config.waMessage' not in s and needle in s:
                  s=s.replace(needle,repl,1)
              needle2=" for(const k of ['date','eventDateLabel','eventTimeLabel','city','venue','wa','sympla','insta','email','address','mapLink','mapEmbedUrl','vognPhoto','glitzyPhoto'])c[k]=$(k).value.trim();"
              repl2=needle2+"\n c.waMessage={pt:waMessagePt.value.trim(),es:waMessageEs.value.trim()};"
              if 'c.waMessage={pt:waMessagePt' not in s and needle2 in s:
                  s=s.replace(needle2,repl2,1)
              p.write_text(s,encoding='utf-8')

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/whatsapp-prefill.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add editable WhatsApp purchase messages"
          git push
