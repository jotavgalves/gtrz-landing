name: Fix icons and favicon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-icons-favicon.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore icons and GTRZ favicon
        shell: python
        run: |
          from pathlib import Path

          WA = '''<svg class="btn-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.52 3.48A11.88 11.88 0 0 0 12.06 0C5.45 0 .09 5.36.09 11.97c0 2.11.55 4.18 1.6 6L0 24l6.2-1.62a11.9 11.9 0 0 0 5.86 1.5h.01c6.61 0 11.97-5.36 11.97-11.97 0-3.2-1.25-6.2-3.52-8.43ZM12.07 21.86h-.01a9.9 9.9 0 0 1-5.04-1.38l-.36-.21-3.68.96.98-3.59-.23-.37a9.88 9.88 0 0 1-1.52-5.3c0-5.47 4.45-9.92 9.93-9.92 2.65 0 5.14 1.03 7.01 2.9a9.86 9.86 0 0 1 2.9 7.01c0 5.47-4.45 9.92-9.92 9.92Zm5.44-7.41c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.08-.3-.15-1.27-.47-2.43-1.5-.9-.8-1.5-1.78-1.68-2.08-.18-.3-.02-.46.13-.61.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.5h-.57c-.2 0-.52.07-.8.37-.27.3-1.03 1-1.03 2.43 0 1.43 1.05 2.82 1.2 3.02.15.2 2.06 3.15 5 4.42.7.3 1.24.47 1.66.6.7.22 1.34.19 1.84.11.56-.08 1.77-.72 2.02-1.41.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z" fill="currentColor"/></svg>'''
          TICKET = '''<svg class="btn-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5V9a3 3 0 0 0 0 6v1.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5V15a3 3 0 0 0 0-6V7.5Z" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v2m0 2v2m0 2v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'''
          INSTA = '''<svg class="social-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor"/></svg>'''
          EMAIL = '''<svg class="social-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="m4.5 7 7.5 6 7.5-6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>'''
          MAP = '''<svg class="btn-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg>'''

          def patch_html(path):
              p = Path(path)
              if not p.exists(): return
              s = p.read_text(encoding='utf-8')

              favicon = '<link rel="icon" type="image/svg+xml" href="/GTRZ%20LOGO%20PADR%C3%83O%20VERMELHO.svg">\n<link rel="shortcut icon" href="/GTRZ%20LOGO%20PADR%C3%83O%20VERMELHO.svg">'
              if 'rel="icon"' not in s:
                  s = s.replace('<meta name="theme-color" content="#080808">', '<meta name="theme-color" content="#080808">\n' + favicon)

              s = s.replace(
                  '<a class="btn js-map" href="https://maps.app.goo.gl/hxZQ5EvmzsmCLXGb7" target="_blank" rel="noopener" data-t="openMap">Como chegar</a>',
                  f'<a class="btn js-map" href="https://maps.app.goo.gl/hxZQ5EvmzsmCLXGb7" target="_blank" rel="noopener">{MAP}<span data-t="openMap">Como chegar</span></a>'
              )
              s = s.replace(
                  '<div class="ticket-actions"><a class="btn js-wa" href="#" target="_blank" data-t="buyNoFee">Comprar sem taxa</a><a class="btn alt js-ticket" href="#" target="_blank" data-t="buySympla">Comprar no Sympla</a></div>',
                  f'<div class="ticket-actions"><a class="btn js-wa" href="#" target="_blank">{WA}<span data-t="buyNoFee">Comprar sem taxa</span></a><a class="btn alt js-ticket" href="#" target="_blank">{TICKET}<span data-t="buySympla">Comprar no Sympla</span></a></div>'
              )
              s = s.replace(
                  '<a class="btn js-ticket" href="#" target="_blank"><span data-t="buySympla">Comprar no Sympla</span></a>',
                  f'<a class="btn js-ticket" href="#" target="_blank">{TICKET}<span data-t="buySympla">Comprar no Sympla</span></a>'
              )
              s = s.replace(
                  '<a class="social-chip js-wa" href="#" target="_blank"><span>WhatsApp</span></a>',
                  f'<a class="social-chip js-wa" href="#" target="_blank">{WA}<span>WhatsApp</span></a>'
              )
              s = s.replace(
                  '<a class="social-chip js-insta" href="#" target="_blank" rel="noopener"><span>Instagram</span></a>',
                  f'<a class="social-chip js-insta" href="#" target="_blank" rel="noopener">{INSTA}<span>Instagram</span></a>'
              )
              s = s.replace(
                  '<a class="social-chip js-email" href="#"><span>Email</span></a>',
                  f'<a class="social-chip js-email" href="#">{EMAIL}<span>Email</span></a>'
              )
              s = s.replace(
                  '<div class="float-buy"><div><small id="floatLotLabel">1º lote</small><strong>R$ <span id="priceFloat">50</span></strong></div><a href="#ingressos" data-t="floatBtn">Garantir ingresso</a></div>',
                  f'<div class="float-buy"><div><small id="floatLotLabel">1º lote</small><strong>R$ <span id="priceFloat">50</span></strong></div><a href="#ingressos">{TICKET}<span data-t="floatBtn">Garantir ingresso</span></a></div>'
              )
              p.write_text(s, encoding='utf-8')

          for path in ['index.html', 'public/index.html']:
              patch_html(path)

          def patch_admin(path):
              p=Path(path)
              if not p.exists(): return
              s=p.read_text(encoding='utf-8')
              favicon='<link rel="icon" type="image/svg+xml" href="/GTRZ%20LOGO%20PADR%C3%83O%20VERMELHO.svg">\n<link rel="shortcut icon" href="/GTRZ%20LOGO%20PADR%C3%83O%20VERMELHO.svg">'
              if 'rel="icon"' not in s:
                  s=s.replace('<meta name="robots" content="noindex,nofollow">', '<meta name="robots" content="noindex,nofollow">\n'+favicon)
              p.write_text(s,encoding='utf-8')

          for path in ['admin/index.html','public/admin/index.html']:
              patch_admin(path)

          def patch_css(path):
              p=Path(path)
              if not p.exists(): return
              s=p.read_text(encoding='utf-8')
              extra='''.social-chip{gap:9px}.social-chip .btn-ico,.social-chip .social-ico{width:16px;height:16px;display:block;flex:none}.float-buy a{display:inline-flex;align-items:center;gap:8px}.float-buy .btn-ico{width:14px;height:14px}\n'''
              if '.social-chip .social-ico' not in s:
                  s += '\n' + extra
              p.write_text(s,encoding='utf-8')

          for path in ['assets/site.css','public/assets/site.css']:
              patch_css(path)

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/fix-icons-favicon.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore CTA icons and add GTRZ favicon"
          git push origin HEAD:main
